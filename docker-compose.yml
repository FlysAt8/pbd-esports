services:
  postgres:
    image: postgres:16
    container_name: esports-postgres
    environment:
      POSTGRES_DB: esports_db
      POSTGRES_USER: esports_user
      POSTGRES_PASSWORD: esports_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: